<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard – Team 1</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="dashboard-frame">

    <header class="dashboard-header">
      <a class="dashboard-header-brand" href="./index.html">LifeTrack</a>
      <div class="dashboard-header-actions">
        <span class="dashboard-header-link">Team 1 &nbsp;•&nbsp; Spring 2026</span>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="dashboard-sidebar">
        <nav class="dashboard-nav">
          <a class="dashboard-nav-link" href="./index.html">Home</a>
          <a class="dashboard-nav-link" href="./goals.html">Goals</a>
          <a class="dashboard-nav-link" href="./academic.html">Academic</a>
          <a class="dashboard-nav-link" href="./wellness.html">Wellness</a>
          <a class="dashboard-nav-link active" href="./admin.html">Admin</a>
        </nav>
      </aside>

      <main class="dashboard-main">

        <section class="hero">
          <h1>Admin Dashboard</h1>
          <p>Manage users, review content, and monitor platform activity.</p>
        </section>

        <!-- Section 1: Summary Cards -->
        <div class="summary-row">
          <div class="summary-card">
            <div class="s-value" id="stat-total-users">7</div>
            <div class="s-label">Total Users</div>
          </div>
          <div class="summary-card">
            <div class="s-value green" id="stat-active-users">6</div>
            <div class="s-label">Active Users</div>
          </div>
          <div class="summary-card">
            <div class="s-value accent" id="stat-resources">6</div>
            <div class="s-label">Resources</div>
          </div>
          <div class="summary-card">
            <div class="s-value amber" id="stat-pending">3</div>
            <div class="s-label">Pending Review</div>
          </div>
        </div>

        <!-- Section 2: User Management -->
        <div class="section-heading">User Management</div>
        <div class="assign-list" id="user-list"></div>

        <!-- Section 3: Content Moderation -->
        <div class="section-heading">Content Moderation</div>
        <div class="assign-list" id="resource-list"></div>

        <div class="footer">Team 1 • Spring 2026</div>

      </main>
    </div>
  </div>

  <script src="./js/admin.js"></script>
</body>
</html>
